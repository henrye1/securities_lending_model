[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securities-lending-model-backend"
version = "0.1.0"
description = "Securities Lending (Share Cover) Model - PD/LGD/EL/RWA engine (CYTE Risk Suite)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "supabase>=2.4",
  "httpx>=0.27",
  "structlog>=24.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
